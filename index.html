 document.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>{const id=b.dataset.yt,y=$("#yt"),fb=()=>{y.innerHTML=`<p style="color:var(--mut)">La lecture intégrée est bloquée dans cet aperçu. <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Ouvrir sur YouTube</a></p>`},h=e=>{if(/frame/.test(e.violatedDirective)){document.removeEventListener("securitypolicyviolation",h);fb()}};document.addEventListener("securitypolicyviolation",h);y.innerHTML=`<iframe style="width:100%;aspect-ratio:16/9;border:0;margin-top:8px" src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`});
 files(s);
 const nav=d=>go({n:"show",id:db[(i+d+db.length)%db.length].id,t:0});
 $("#pv").onclick=()=>nav(-1);$("#nx").onclick=()=>nav(1);$("#ed").onclick=()=>go({n:"edit",id:s.id});
 $("#m").onclick=()=>{view.t--;show()};$("#p").onclick=()=>{view.t++;show()}}
const FD=[["titre","Titre *"],["interprete","Interprète"],["style","Style"],["registration","Registration"],["tempo","Tempo","number"],["voix1","Voix 1"],["voix2","Voix 2"],["date","Date perform.","date"],["url","URL vidéo 1"],["url2","URL vidéo 2"],["hyperlink","Lien"]];
function edit(){
 const s=view.id?{...db.find(x=>x.id==view.id)}:{id:"n"+Date.now(),type:"Chanson",statut:"A voir",note:0,accords:""};const isNew=!view.id;
 hd(isNew?"Nouvelle chanson":"Modifier",()=>go(isNew?{n:"list"}:{n:"show",id:s.id,t:0}),`<button class="ib" id="ok">✓</button>`);
 const cl=[...new Set([...CLAV,...db.map(x=>x.clavier).filter(Boolean)])];
 $("#app").innerHTML=`<form onsubmit="return false">${FD.slice(0,2).map(f=>fld(f,s)).join("")}<div><label>Statut</label><select id="f_statut">${STAT.map(x=>`<option ${s.statut==x?"selected":""}>${x}</option>`).join("")}</select></div>
 ${FD.slice(2).map(f=>fld(f,s)).join("")}<div><label>Clavier</label><input type="text" id="f_clavier" list="cl" value="${esc(s.clavier)}"><datalist id="cl">${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
 <div><label>Note</label><div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=s.note?"on":""}">★</span>`).join("")}</div></div>
 <div><label>Fichier MIDI</label><div id="fm"></div><input type="file" id="im" accept=".mid,.midi,audio/midi,audio/x-midi"></div>
 <div><label>Audio</label><div id="fa"></div><input type="file" id="ia" accept="audio/*"> <button class="btn sec" id="rec" type="button">● Enregistrer</button></div>
 <div><label>Remarques</label><textarea id="f_remarques" rows="2">${esc(s.remarques)}</textarea></div>
 <div><label>Accords — écrire les accords entre crochets, juste avant la syllabe : [Am]Besame [Dm]mucho</label><textarea id="f_accords" rows="14" style="font-family:ui-monospace,monospace">${esc(s.accords)}</textarea></div>
 ${isNew?"":`${s.midi?'<button class="btn sec" type="button" id="xm">Retirer le MIDI</button>':""}${s.audio?'<button class="btn sec" type="button" id="xa">Retirer l’audio</button>':""}<button class="btn sec" id="del" style="color:var(--ac)">Supprimer cette chanson</button>`}</form>`;
 let note=s.note||0,pm,pa,rc;
 const lab=()=>{$("#fm").textContent=pm=="del"?"(sera supprimé)":pm?pm.name:s.midi||"";$("#fa").textContent=pa=="del"?"(sera supprimé)":pa?pa.name:s.audio||""};lab();
 $("#im").onchange=e=>{pm=e.target.files[0];lab()};$("#ia").onchange=e=>{pa=e.target.files[0];lab()};
 $("#rec").onclick=async()=>{try{if(rc){rc.stop();return}const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rc=new MediaRecorder(st);rc.ondataavailable=e=>ch.push(e.data);
  rc.onstop=()=>{st.getTracks().forEach(x=>x.stop());pa=new File(ch,"enregistrement-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".webm",{type:rc.mimeType});rc=null;$("#rec").textContent="● Enregistrer";lab()};rc.start();$("#rec").textContent="■ Arrêter"}catch(e){alert("Micro indisponible ici.")}};document.querySelectorAll("#st span").forEach(e=>e.onclick=()=>{note=note==+e.dataset.n?0:+e.dataset.n;document.querySelectorAll("#st span").forEach(x=>x.classList.toggle("on",+x.dataset.n<=note))});
 $("#ok").onclick=async()=>{const o={...s,note};[...FD.map(f=>f[0]),"statut","clavier","remarques","accords"].forEach(k=>o[k]=$("#f_"+k).value);
  if(!o.titre.trim())return alert("Le titre est obligatoire.");for(const [k,p] of [["midi",pm],["audio",pa]]){if(p=="del"){await fdel(o.id+":"+k);o[k]=""}else if(p){await fput(o.id+":"+k,{name:p.name,blob:p});o[k]=p.name}}
  if(isNew)db.push(o);else db[db.findIndex(x=>x.id==s.id)]=o;save();go({n:"show",id:o.id,t:0})};
 const xm=$("#xm"),xa=$("#xa");if(xm)xm.onclick=()=>{pm="del";lab()};if(xa)xa.onclick=()=>{pa="del";lab()};
 const d=$("#del");if(d)d.onclick=()=>{if(confirm("Supprimer « "+s.titre+" » ?")){fdel(s.id+":midi");fdel(s.id+":audio");db=db.filter(x=>x.id!=s.id);save();go({n:"list"})}}}
function fld([k,l,t],s){return `<div><label>${l}</label><input type="${t||"text"}" id="f_${k}" value="${esc(s[k])}"></div>`}
async function dl(name,type,data){try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code=="declined")return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function menu(){const c=prompt("1 = Exporter tout (JSON, avec fichiers)\n2 = Importer (JSON)\n3 = Exporter (CSV)\n4 = Réinitialiser avec les données d’origine");
 if(c=="1")(async()=>{const f={};for(const s of db)for(const k of["midi","audio"]){const v=s[k]&&await fget(s.id+":"+k);if(v)f[s.id+":"+k]={name:v.name,type:v.blob.type,data:await b64(v.blob)}}dl("psr_chansons.json","application/json",JSON.stringify({songs:db,files:f}))})();
 else if(c=="3"){const k=Object.keys(db[0]||{}),e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';dl("psr_chansons.csv","text/csv",[k.map(e).join(","),...db.map(s=>k.map(x=>e(s[x])).join(","))].join("\n"))}
 else if(c=="2"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{let a=JSON.parse(await i.files[0].text()),f={};if(!Array.isArray(a)){f=a.files||{};a=a.songs}if(!Array.isArray(a))throw 0;db=a;save();for(const k in f){const bl=await (await fetch(f[k].data)).blob();await fput(k,{name:f[k].name,blob:bl})}render()}catch(e){alert("Fichier invalide.")}};i.click()}
 else if(c=="4"&&confirm("Effacer vos modifications ?")){db=JSON.parse(JSON.stringify(SEED));save();render()}}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
