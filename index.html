const jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function login(){hd("Connexion");$("#app").innerHTML=`<form onsubmit="return false"><label>Email</label><input type="text" id="le" autocomplete="username"><label>Mot de passe</label><input type="password" id="lp" autocomplete="current-password"><button class="btn" id="lg">Se connecter</button><p id="lm" style="color:var(--ac)"></p></form>`;

/* ===== MIDI : lecture dans l'appli ===== */
function parseMidi(buf){
 const u=new Uint8Array(buf),d=new DataView(buf);let p=0;const str=n=>{let s="";for(let i=0;i<n;i++)s+=String.fromCharCode(u[p++]);return s};
 if(str(4)!="MThd")throw new Error("pas un fichier MIDI");const hl=d.getUint32(p);p+=4;const nt=d.getUint16(p+2);let div=d.getUint16(p+4);p+=hl;if(div&0x8000||!div)div=480;
 const ev=[];let seq=0;
 for(let k=0;k<nt&&p<u.length;k++){if(str(4)!="MTrk")break;const len=d.getUint32(p);p+=4;const end=Math.min(u.length,p+len);let tick=0,rs=0;
  const vlq=()=>{let v=0,b;do{b=u[p++];v=(v<<7)|(b&127)}while((b&128)&&p<end);return v};
  while(p<end){tick+=vlq();let st=u[p];if(st<0x80){st=rs}else{p++;if(st<0xF0)rs=st}
   if(st==0xFF){const ty=u[p++],l=vlq();if(ty==0x51&&l==3)ev.push({tick,s:seq++,k:"tempo",us:(u[p]<<16)|(u[p+1]<<8)|u[p+2]});p+=l}
   else if(st==0xF0||st==0xF7){p+=vlq()}
   else{const c=st&15,ty=st>>4;
    if(ty==9||ty==8){const n=u[p++],v=u[p++];ev.push({tick,s:seq++,k:(ty==9&&v>0)?"on":"off",c,n,v})}
    else if(ty==0xC){ev.push({tick,s:seq++,k:"prog",c,n:u[p++]})}
    else if(ty==0xB){const cc=u[p++],v=u[p++];ev.push({tick,s:seq++,k:"cc",c,cc,v})}
    else if(ty==0xD){p++}else p+=2}}
  p=end}
 ev.sort((a,b)=>a.tick-b.tick||a.s-b.s);
 let tm=0,lt=0,tempo=500000;const prog=new Array(16).fill(0),vol=new Array(16).fill(100),ex=new Array(16).fill(127),open={},notes=[];
 for(const e of ev){tm+=(e.tick-lt)*tempo/(div*1e6);lt=e.tick;
  if(e.k=="tempo")tempo=e.us||500000;
  else if(e.k=="prog")prog[e.c]=e.n;
  else if(e.k=="cc"){if(e.cc==7)vol[e.c]=e.v;else if(e.cc==11)ex[e.c]=e.v}

const FR=["Do","Do#","Ré","Ré#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"],PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

 let third=4,fifth=7,sev=null,add=[];
 if(/^(dim|°|o)/.test(s)){third=3;fifth=6;s=s.replace(/^(dim|°|o)/,"");if(/^7/.test(s)){sev=9;s=s.slice(1)}}
 else if(/^(aug|\+)/.test(s)){fifth=8;s=s.replace(/^(aug|\+)/,"")}

  else if(x=s.match(/^b9/)){add.push(13);s=s.slice(2)}
  else if(x=s.match(/^#9/)){add.push(15);s=s.slice(2)}
  else if(x=s.match(/^#11/)){add.push(18);s=s.slice(3)}
  else if(x=s.match(/^b13/)){add.push(20);s=s.slice(3)}
  else if(x=s.match(/^ø/)){third=3;fifth=6;sev=10;s=s.slice(1)}
