 ${s.seq?`<div class="sec-t tg" id="tgk"><span id="tgka">${kbOpen?"▾":"▸"}</span><b>Clavier</b></div><div id="kbb" class="${kbOpen?"":"hide"}" style="padding:0 12px"><div class="kbs" id="kbs"></div></div>`:""}
 <div class="sec-t tg" id="tgm"><span id="tgma">${mediaOpen?"▾":"▸"}</span><b>Médias</b></div><div id="medb" class="${mediaOpen?"":"hide"}" style="padding:0 12px">
 ${vids.map(u=>ytid(u)?`<div class="mc"><div class="mh">▶ YouTube<small>${esc(u.slice(0,48))}</small></div><div class="mb"><button class="btn sec" type="button" data-yt="${ytid(u)}">Lire (fenêtre)</button><a href="${esc(u)}" target="_blank" rel="noopener">↗ ouvrir dans YouTube</a></div></div>`:`<div class="mc"><div class="mh">🔗 Lien<small><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.slice(0,48))}</a></small></div></div>`).join("")}
 ${s.audio?`<div class="mc"><div class="mh">🎵 Audio<small>${esc(s.audio)}</small></div><div class="mb" id="mb-audio">Chargement…</div></div>`:""}
 ${s.midi?`<div class="mc"><div class="mh">🎹 MIDI<small>${esc(s.midi)}</small></div><div class="mb" id="mb-midi">Chargement…</div></div>`:""}
 ${!vids.length&&!s.audio&&!s.midi?'<div class="mq" style="margin:8px 0">Aucun média (à ajouter via ✎)</div>':""}</div>
 <div class="sec-t">Accords</div><div class="tools"><button class="btn sec" id="m">−</button><b>${view.t>0?"+":""}${view.t}</b><button class="btn sec" id="p">+</button>${(()=>{const k=isLesson(s)?null:keyOf(s.accords);if(!k)return'<span style="color:var(--mut);font-size:13px">transposition (demi-tons)</span>';const cur=((k.i+view.t)%12+12)%12;return `<label style="display:flex;align-items:center;gap:6px">Tonalité <select id="tk">${KN.map((n,j)=>`<option value="${j}" ${j==cur?"selected":""}>${n}${k.min?"m":""}${j==k.i?" (originale)":""}</option>`).join("")}</select></label>`})()}${view.t?'<button class="btn sec" id="t0" type="button">↺ Tonalité d\'origine</button>':""}</div><div class="song">${chords(s.accords,view.t,isLesson(s))||'<span style="color:var(--mut)">Aucun accord</span>'}</div>`;
 document.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>pipOpen(b.dataset.yt,s.id));
 $("#tgi").onclick=()=>{infoOpen=!infoOpen;try{localStorage.setItem("psr_info",infoOpen?"1":"0")}catch(e){}$("#tga").textContent=infoOpen?"▾":"▸";$("#infob").classList.toggle("hide",!infoOpen)};
 $("#app").onclick=e=>{const c=e.target.closest("i[data-c]");if(c)showChord(c.dataset.c)};
 $("#tgm").onclick=()=>{mediaOpen=!mediaOpen;try{localStorage.setItem("psr_media",mediaOpen?"1":"0")}catch(e){}$("#tgma").textContent=mediaOpen?"▾":"▸";$("#medb").classList.toggle("hide",!mediaOpen)};
 asBar();
 tmWire(s);if(s.seq)kbInit(s);loadMedia(s);refreshSong(s.id);
 const nav=d=>{const S=view.sess&&ext.find(x=>x.id==view.sess),ids=S&&S.items.filter(x=>song(x.sid)).length>1?S.items.map(x=>x.sid).filter(song):db.map(x=>x.id),k=ids.indexOf(s.id);go({n:"show",id:ids[(k+d+ids.length)%ids.length],t:0,sess:view.sess})};
 $("#pv").onclick=()=>nav(-1);$("#nx").onclick=()=>nav(1);$("#ed").onclick=()=>go({n:"edit",id:s.id});
 const setT=t=>{view.t=t;s.tr=t||undefined;if(!t)delete s.tr;touch(s.id);save();curChord=null;show()};$("#m").onclick=()=>setT(view.t-1);$("#p").onclick=()=>setT(view.t+1);const tk=$("#tk");if(tk)tk.onchange=()=>{const k=keyOf(s.accords),d=(((+tk.value-k.i)%12)+12)%12;setT(d>6?d-12:d)};const t0=$("#t0");if(t0)t0.onclick=()=>setT(0)}
const FD=[["titre","Titre *"],["interprete","Interprète"],["style","Style"],["registration","Registration"],["tempo","Tempo","number"],["voix1","Voix 1"],["voix2","Voix 2"],["date","Date perform.","date"],["url","URL vidéo 1"],["url2","URL vidéo 2"],["hyperlink","Lien"]];
function edit(){
 const s=view.id?{...db.find(x=>x.id==view.id)}:{id:"n"+Date.now(),type:view.type||"Chanson",statut:"A voir",note:0,accords:""};const isNew=!view.id;
 hd(isNew?"Nouvelle chanson":"Modifier",()=>go(isNew?{n:"list"}:{n:"show",id:s.id,t:0}),`<button class="ib" id="ok">✓</button>`);
 const cl=[...new Set([...CLAV,...db.map(x=>x.clavier).filter(Boolean)])];
 $("#app").innerHTML=`<form onsubmit="return false">${FD.slice(0,2).map(f=>fld(f,s)).join("")}<div><label>Type</label><select id="f_type"><option value="Chanson" ${isLesson(s)?"":"selected"}>🎵 Morceau</option><option value="Leçon" ${isLesson(s)?"selected":""}>🎓 Leçon</option></select></div><div id="lex" class="lex ${isLesson(s)?"":"hide"}"><div><label>Objectif de la leçon</label><input type="text" id="f_objectif" value="${esc(s.objectif)}"></div><div><label>Durée prévue (minutes)</label><input type="number" id="f_duree" value="${esc(s.duree)}"></div></div><div><label>Statut</label><select id="f_statut">${STAT.map(x=>`<option ${s.statut==x?"selected":""}>${x}</option>`).join("")}</select></div>
 ${FD.slice(2).map(f=>fld(f,s)).join("")}<div><label>Clavier</label><input type="text" id="f_clavier" list="cl" value="${esc(s.clavier)}"><datalist id="cl">${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
 <div><label>Note</label><div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=s.note?"on":""}">★</span>`).join("")}</div></div>
 <div><label>Fichier MIDI</label><div id="fm"></div><input type="file" id="im" accept=".mid,.midi,audio/midi,audio/x-midi"></div>
 <div><label>Audio</label><div id="fa"></div><input type="file" id="ia" accept="audio/*"> <button class="btn sec" id="rec" type="button">● Enregistrer</button></div>
 <div><label>Remarques</label><textarea id="f_remarques" rows="2">${esc(s.remarques)}</textarea></div>
 <div><label>Accords — écrire les accords entre crochets, juste avant la syllabe : [Am]Besame [Dm]mucho</label><textarea id="f_accords" rows="14" style="font-family:ui-monospace,monospace">${esc(s.accords)}</textarea><button class="btn sec" id="cvg" type="button" style="margin-top:6px">⇄ Convertir une grille collée (accords au-dessus du texte)</button></div>
 ${isNew?"":`${s.midi?'<button class="btn sec" type="button" id="xm">Retirer le MIDI</button>':""}${s.audio?'<button class="btn sec" type="button" id="xa">Retirer l’audio</button>':""}<button class="btn sec" id="del" style="color:var(--ac)">Supprimer cette chanson</button>`}</form>`;
 let note=s.note||0,pm,pa,rc;
 const lab=()=>{$("#fm").textContent=pm=="del"?"(sera supprimé)":pm?pm.name:s.midi||"";$("#fa").textContent=pa=="del"?"(sera supprimé)":pa?pa.name:s.audio||""};lab();
 $("#im").onchange=e=>{pm=e.target.files[0];lab()};$("#ia").onchange=e=>{pa=e.target.files[0];lab()};
 $("#rec").onclick=async()=>{try{if(rc){rc.stop();return}const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rc=new MediaRecorder(st);rc.ondataavailable=e=>ch.push(e.data);
  rc.onstop=()=>{st.getTracks().forEach(x=>x.stop());pa=new File(ch,"enregistrement-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".webm",{type:rc.mimeType});rc=null;$("#rec").textContent="● Enregistrer";lab()};rc.start();$("#rec").textContent="■ Arrêter"}catch(e){alert("Micro indisponible ici.")}};document.querySelectorAll("#st span").forEach(e=>e.onclick=()=>{note=note==+e.dataset.n?0:+e.dataset.n;document.querySelectorAll("#st span").forEach(x=>x.classList.toggle("on",+x.dataset.n<=note))});
 $("#ok").onclick=async()=>{const o={...s,note};cvt();[...FD.map(f=>f[0]),"statut","clavier","remarques","accords","type","objectif","duree"].forEach(k=>o[k]=$("#f_"+k).value);
  if(!o.titre.trim())return alert("Le titre est obligatoire.");for(const [k,p] of [["midi",pm],["audio",pa]]){if(p=="del"){await fdel(o.id+":"+k);o[k]=""}else if(p){if(await fput(o.id+":"+k,{name:p.name,blob:p}))o[k]=p.name}}
  if(isNew)db.push(o);else db[db.findIndex(x=>x.id==s.id)]=o;touch(o.id);save();go({n:"show",id:o.id,t:0})};
 const cvt=()=>{const ta=$("#f_accords");if(hasGrille(ta.value))ta.value=grille2cp(ta.value)};
 $("#f_type").onchange=e=>$("#lex").classList.toggle("hide",e.target.value!="Leçon");
 $("#cvg").onclick=()=>{const ta=$("#f_accords");ta.value=grille2cp(ta.value)};
 $("#f_accords").addEventListener("paste",()=>setTimeout(cvt,0));
 const xm=$("#xm"),xa=$("#xa");if(xm)xm.onclick=()=>{pm="del";lab()};if(xa)xa.onclick=()=>{pa="del";lab()};
 const d=$("#del");if(d)d.onclick=()=>{if(confirm("Supprimer « "+s.titre+" » ?")){fdel(s.id+":midi");fdel(s.id+":audio");db=db.filter(x=>x.id!=s.id);remove(s.id);save();go({n:"list"})}}}
function fld([k,l,t],s){return `<div><label>${l}</label><input type="${t||"text"}" id="f_${k}" value="${esc(s[k])}"></div>`}
async function dl(name,type,data){try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code=="declined")return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
async function doImport(file){
 try{let a=JSON.parse(await file.text()),f={},xs=[];if(!Array.isArray(a)){f=a.files||{};xs=a.sessions||[];a=a.songs}if(!Array.isArray(a))throw new Error("format");
  a.forEach(x=>{const j=db.findIndex(y=>y.id==x.id);if(j<0)db.push(x);else db[j]=x;touch(x.id)});persist();xs.forEach(x=>{const j=ext.findIndex(y=>y.id==x.id);if(j<0)ext.push(x);else ext[j]=x;touch(x.id)});persistExt();
  for(const k in f){const bl=await (await fetch(f[k].data)).blob();await fput(k,{name:f[k].name,blob:bl})}
  while(syncing)await new Promise(r=>setTimeout(r,250));await sync(true);alert(a.length+" fiches importées. "+syncMsg)}
 catch(e){alert("Fichier invalide ou import impossible : "+e.message)}}
async function exportAll(){const f={};for(const s of db)for(const k of["midi","audio"]){const v=s[k]&&await fget(s.id+":"+k);if(v&&v.blob)f[s.id+":"+k]={name:s[k],type:v.blob.type,data:await b64(v.blob)}}dl("psr_chansons.json","application/json",JSON.stringify({songs:db,sessions:ext,files:f}))}
function exportCsv(){const k=Object.keys(db[0]||{}),e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';dl("psr_chansons.csv","text/csv",[k.map(e).join(","),...db.map(s=>k.map(x=>e(s[x])).join(","))].join("\n"))}
function menu(){
 const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center";
 o.innerHTML=`<div style="background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px">
 <div style="color:var(--mut);font-size:13px">${esc(syncMsg)||""} · ${db.length} fiches</div>
 <label class="btn sec" style="text-align:center;cursor:pointer;font-size:16px;color:var(--fg);margin:0">Importer un fichier JSON<input type="file" id="mi" accept=".json,application/json,text/plain,*/*" style="display:none"></label>
 <button class="btn sec" id="m4">Synchroniser maintenant</button>
 <button class="btn sec" id="m1">Exporter tout (JSON, avec fichiers)</button>
 <button class="btn sec" id="m3">Exporter (CSV)</button>
 <button class="btn sec" id="mhq"></button>
 <button class="btn sec" id="m5">Se déconnecter</button>
 <button class="btn sec" id="mx">Fermer</button></div>`;
 document.body.appendChild(o);const close=()=>o.remove();
 o.onclick=e=>{if(e.target==o)close()};$("#mx").onclick=close;
 $("#mi").onchange=e=>{const f=e.target.files[0];close();if(f)doImport(f)};
 $("#m4").onclick=async()=>{close();await sync(true);alert("Synchronisation : "+syncMsg+" — "+db.length+" fiches.");if(view.n=="show")show()};
 const hqOn=()=>{try{return localStorage.getItem("psr_hq")==="1"}catch(e){return false}},hqLab=()=>{$("#mhq").textContent="Rendu MIDI : "+(hqOn()?"amélioré (sons téléchargés)":"léger")+" — changer"};hqLab();
 $("#mhq").onclick=()=>{try{localStorage.setItem("psr_hq",hqOn()?"0":"1")}catch(e){}hqLab();if(view.n=="show")alert("Réglage pris en compte à la prochaine ouverture d'une fiche.")};
 $("#m1").onclick=()=>{close();exportAll()};$("#m3").onclick=()=>{close();exportCsv()};$("#m5").onclick=()=>{close();logout()}}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
