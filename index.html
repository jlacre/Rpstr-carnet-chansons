<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#9e2013"><link rel="apple-touch-icon" href="icon-192.png"><title>PSR Chansons</title>
<style>
:root{--bg:#fff;--fg:#1c1b1a;--mut:#6b6762;--card:#f6f3f1;--line:#e3ded9;--ac:#9e2013;--chord:#566896;--ok:#3d8f3d;--wip:#a8a100;--todo:#777;--inc:#c26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161514;--fg:#eee9e4;--mut:#a09a94;--card:#222120;--line:#38352f;--ac:#d9534a;--chord:#8fa6e0;--ok:#6cc16c;--wip:#d8d04a;--todo:#a0a0a0;--inc:#ee9a3a}}
:root[data-theme=dark]{--bg:#161514;--fg:#eee9e4;--mut:#a09a94;--card:#222120;--line:#38352f;--ac:#d9534a;--chord:#8fa6e0;--ok:#6cc16c;--wip:#d8d04a;--todo:#a0a0a0;--inc:#ee9a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--ac);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ac);z-index:10}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input,textarea{font:inherit;color:inherit}
.ib{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
main{padding:0 0 90px;max-width:760px;margin:auto}
.bar{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
input[type=search],input[type=password],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.row b{font-weight:500;font-size:17px}.row small{color:var(--mut);display:block}.st{font-size:13px;text-align:right}
.s-Connu{color:var(--ok)}.s-En-cours{color:var(--wip)}.s-A-voir{color:var(--todo)}.s-A-compléter{color:var(--inc)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;font-size:28px;background:var(--ac);color:#fff;border:0;box-shadow:0 2px 8px #0005;cursor:pointer}
.count{padding:8px 12px;color:var(--mut);font-size:13px}
.sec-t{color:var(--chord);font-weight:600;margin:16px 12px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:0 12px}.grid div span{display:block;color:var(--mut);font-size:12px}
.song{font-family:ui-monospace,monospace;font-size:15px;padding:8px 12px;overflow-x:auto}
.ln{white-space:pre;min-height:1.4em;margin-bottom:.5em}.sg{display:inline-flex;flex-direction:column;vertical-align:bottom}.sg i{font-style:normal;font-weight:700;color:var(--chord);padding-right:.5em;min-height:1.3em}
form{padding:12px;display:flex;flex-direction:column;gap:10px}label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.stars span{font-size:30px;cursor:pointer;color:var(--line)}.stars span.on{color:#4297c9}
.tools{display:flex;gap:8px;align-items:center;padding:6px 12px;flex-wrap:wrap}.tools b{min-width:2.5em;text-align:center}
a{color:var(--chord)}.hide{display:none}
</style></head><body>
<header id="hd"></header><main id="app"></main>
<script>
const SEED=[];
const KEY="psr_db_v2",STAT=["Connu","En cours","A voir","A compléter"],CLAV=["PSR S970","PSR 330"];
let db,view={n:"list"},q="",flt="",sortBy="titre";
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let stT;function save(){persist();clearTimeout(stT);stT=setTimeout(()=>sync(),600)}
const SB="https://lagqskvqnftcxpdncuju.supabase.co",PK="sb_publishable_gnpmELpeqJvJjOgvb_OmpA_LksRnQbh",SK="psr_ses",QK="psr_queue";
const jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let ses=jget(SK),Q=jget(QK)||{},syncMsg="",syncing=0;
const touch=id=>{Q[id]="u";jset(QK,Q)},remove=id=>{Q[id]="d";jset(QK,Q)};
async function authCall(grant,body){let r;try{r=await fetch(SB+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:PK,"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("net")}
 if(!r.ok)throw new Error("auth");const j=await r.json();ses={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+j.expires_in,uid:j.user.id};jset(SK,ses)}
async function tok(){if(!ses)throw new Error("auth");if(ses.expires_at-60<Date.now()/1000){try{await authCall("refresh_token",{refresh_token:ses.refresh_token})}catch(e){if(e.message=="auth"){ses=null;try{localStorage.removeItem(SK)}catch(x){}}throw e}}return ses.access_token}
async function api(path,opt={}){const t=await tok();let r;try{r=await fetch(SB+path,{...opt,headers:{apikey:PK,Authorization:"Bearer "+t,...(opt.headers||{})}})}catch(e){throw new Error("net")}
 if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));return r}
async function sync(manual){if(syncing)return;syncing=1;syncMsg="synchronisation…";if(view.n=="list")list();
 try{for(const id of Object.keys(Q)){if(Q[id]=="d")await api("/rest/v1/songs?id=eq."+encodeURIComponent(id),{method:"DELETE"});
   else{const s=db.find(x=>x.id==id);if(s){const {id:_,...data}=s;await api("/rest/v1/songs?on_conflict=id",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({id,data,updated_at:new Date().toISOString()})})}}
   delete Q[id];jset(QK,Q)}
  const rows=await (await api("/rest/v1/songs?select=id,data&limit=5000")).json();
  db=rows.map(r=>({...r.data,id:r.id}));persist();syncMsg="synchronisé à "+new Date().toTimeString().slice(0,5);
 }catch(e){if(e.message=="auth"){syncing=0;return login()}syncMsg=e.message=="net"?"hors ligne (modifications gardées)":"erreur : "+e.message;if(manual)alert("Synchronisation impossible : "+e.message)}
 finally{syncing=0;if(view.n=="list")list()}}
const fpath=k=>{const [id,kind]=k.split(":");return ses.uid+"/"+id+"/"+kind};
async function fput(k,v){try{await api("/storage/v1/object/fichiers/"+fpath(k),{method:"POST",headers:{"Content-Type":v.blob.type||"application/octet-stream","x-upsert":"true"},body:v.blob});return 1}catch(e){alert("Envoi du fichier impossible (connexion ?).");return 0}}
async function fget(k){try{const r=await api("/storage/v1/object/authenticated/fichiers/"+fpath(k));return {blob:await r.blob()}}catch(e){return null}}
async function fdel(k){try{await api("/storage/v1/object/fichiers/"+fpath(k),{method:"DELETE"})}catch(e){}}
function login(){hd("Connexion");$("#app").innerHTML=`<form onsubmit="return false"><label>Email</label><input type="text" id="le" autocomplete="username"><label>Mot de passe</label><input type="password" id="lp" autocomplete="current-password"><button class="btn" id="lg">Se connecter</button><p id="lm" style="color:var(--ac)"></p></form>`;
 $("#lg").onclick=async()=>{$("#lm").textContent="";try{await authCall("password",{email:$("#le").value.trim(),password:$("#lp").value});render();sync(true)}catch(e){$("#lm").textContent=e.message=="net"?"Pas de connexion.":"Email ou mot de passe incorrect."}}}
function logout(){ses=null;try{localStorage.removeItem(SK)}catch(e){}login()}
function boot(){if(!ses){login();return}render();sync();addEventListener("online",()=>sync());document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()})}
db=load();
const IDB=new Promise(r=>{try{const q=indexedDB.open("psr_files",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function fx(mode,fn){const d=await IDB;if(!d)return null;return new Promise(r=>{try{const s=d.transaction("f",mode).objectStore("f"),q=fn(s);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)}catch(e){r(null)}})}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const ytid=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m&&m[1]};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=s=>"s-"+(s||"").replace(/ /g,"-");
function go(v){view=v;render();scrollTo(0,0)}
function render(){view.n=="list"?list():view.n=="show"?show():edit()}
function hd(t,l,r){$("#hd").innerHTML=(l?`<button class="ib" id="bk">←</button>`:"")+`<h1>${esc(t)}</h1>`+(r||"");if(l)$("#bk").onclick=l}
function list(){
 hd("PSR Chansons",null,`<button class="ib" id="mn">⋮</button>`);$("#mn").onclick=menu;
 const ql=q.toLowerCase(),a=db.filter(s=>(!flt||s.statut==flt)&&(!ql||[s.titre,s.interprete,s.style,s.remarques,s.clavier].join(" ").toLowerCase().includes(ql)))
  .sort((x,y)=>sortBy=="note"?(y.note||0)-(x.note||0):(x[sortBy]||"").localeCompare(y[sortBy]||"","fr"));
 $("#app").innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Rechercher…" value="${esc(q)}"><div class="chips">${["",...STAT].map(s=>`<span class="chip ${flt==s?"on":""}" data-s="${s}">${s||"Tous"}</span>`).join("")}<select id="so" style="width:auto"><option value="titre">Tri : titre</option><option value="interprete">Tri : interprète</option><option value="statut">Tri : statut</option><option value="note">Tri : note</option></select></div></div>`+
 a.map(s=>`<div class="row" data-id="${s.id}"><div><b>${esc(s.titre)}</b><small>${esc(s.interprete)}</small></div><div class="st"><span class="${cls(s.statut)}">${esc(s.statut)}</span><br><small>${esc(s.clavier)}</small></div></div>`).join("")+
 `<div class="count">Enregistrements : ${a.length} / ${db.length} · ${syncMsg}</div><button class="fab" id="add">+</button>`;
 const qi=$("#q");qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;list();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 $("#so").value=sortBy;$("#so").onchange=e=>{sortBy=e.target.value;list()};
 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{flt=c.dataset.s;list()});
 document.querySelectorAll(".row").forEach(r=>r.onclick=()=>go({n:"show",id:r.dataset.id,t:0}));
 $("#add").onclick=()=>go({n:"edit",id:null})}
const N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],FL={Db:"C#",Eb:"D#",Gb:"F#",Ab:"G#",Bb:"A#"};
function tr(c,t){if(!t)return c;const f=n=>{n=FL[n]||n;const i=N.indexOf(n);return i<0?n:N[(i+t+120)%12]};
 const m=c.match(/^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/);return m?f(m[1])+m[2]+(m[3]?"/"+f(m[3]):""):c}
function chords(txt,t){return (txt||"").split("\n").map(l=>{
 const p=l.split(/\[([^\]]+)\]/);let h="";if(p[0])h+=`<span class="sg"><i></i>${esc(p[0])}</span>`;
 for(let i=1;i<p.length;i+=2)h+=`<span class="sg"><i>${esc(tr(p[i].trim(),t))}</i>${esc(p[i+1])||" "}</span>`;
 return `<div class="ln">${h}</div>`}).join("")}
async function files(s){const el=$("#files");if(!el)return;let h="";
 const m=s.midi&&await fget(s.id+":midi"),a=s.audio&&await fget(s.id+":audio");
 if(a){h+=`<div>🎵 ${esc(s.audio)}<br><audio controls style="width:100%" src="${URL.createObjectURL(a.blob)}"></audio></div>`}
 if(m){h+=`<div style="margin:8px 0">🎹 ${esc(s.midi)} — <a id="dm" href="${URL.createObjectURL(m.blob)}" download="${esc(s.midi)}">Ouvrir / enregistrer</a></div>`}
 el.innerHTML=h||'<span style="color:var(--mut)">Aucun fichier MIDI ou audio (à ajouter via ✎)</span>'}
function show(){
 const i=db.findIndex(s=>s.id==view.id),s=db[i];if(!s)return go({n:"list"});
 hd(s.titre,()=>go({n:"list"}),`<button class="ib" id="pv">‹</button><button class="ib" id="nx">›</button><button class="ib" id="ed">✎</button>`);
 const F=(l,v)=>v?`<div><span>${l}</span>${esc(v)}</div>`:"",vids=[s.url,s.url2].filter(Boolean);
 $("#app").innerHTML=`<div class="sec-t">Informations</div><div class="grid">${F("Type",s.type)}${F("Interprète",s.interprete)}<div><span>Statut</span><b class="${cls(s.statut)}">${esc(s.statut)}</b></div>${F("Clavier",s.clavier)}${F("Style",s.style)}${F("Registration",s.registration)}${F("Tempo",s.tempo)}${F("Voix 1",s.voix1)}${F("Voix 2",s.voix2)}${F("Date perform.",s.date)}<div><span>Note</span>${"★".repeat(s.note||0)}${"☆".repeat(5-(s.note||0))}</div></div>${s.remarques?`<div class="grid" style="margin-top:8px;grid-template-columns:1fr">${F("Remarques",s.remarques)}</div>`:""}
 ${vids.length||s.hyperlink?`<div class="sec-t">Liens</div><div style="padding:0 12px">${[...vids,s.hyperlink].filter(Boolean).map(u=>`<div style="margin:4px 0"><a href="${esc(u)}" target="_blank" rel="noopener">${ytid(u)?"▶ ":"🔗 "}${esc(u.slice(0,50))}</a>${ytid(u)?` <button class="btn sec" style="padding:2px 8px" data-yt="${ytid(u)}">Lire ici</button>`:""}</div>`).join("")}<div id="yt"></div></div>`:""}
 <div class="sec-t">Fichiers</div><div id="files" style="padding:0 12px"></div>
 <div class="sec-t">Accords</div><div class="tools"><button class="btn sec" id="m">−</button><b>${view.t>0?"+":""}${view.t}</b><button class="btn sec" id="p">+</button><span style="color:var(--mut);font-size:13px">transposition (demi-tons)</span></div><div class="song">${chords(s.accords,view.t)||'<span style="color:var(--mut)">Aucun accord</span>'}</div>`;
 document.querySelectorAll("[data-yt]").forEach(b=>b.onclick=()=>{const id=b.dataset.yt,y=$("#yt"),fb=()=>{y.innerHTML=`<p style="color:var(--mut)">La lecture intégrée est bloquée dans cet aperçu. <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Ouvrir sur YouTube</a></p>`},h=e=>{if(/frame/.test(e.violatedDirective)){document.removeEventListener("securitypolicyviolation",h);fb()}};document.addEventListener("securitypolicyviolation",h);y.innerHTML=`<iframe style="width:100%;aspect-ratio:16/9;border:0;margin-top:8px" src="https://www.youtube.com/embed/${id}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
 files(s);
 const nav=d=>go({n:"show",id:db[(i+d+db.length)%db.length].id,t:0});
 $("#pv").onclick=()=>nav(-1);$("#nx").onclick=()=>nav(1);$("#ed").onclick=()=>go({n:"edit",id:s.id});
 $("#m").onclick=()=>{view.t--;show()};$("#p").onclick=()=>{view.t++;show()}}
const FD=[["titre","Titre *"],["interprete","Interprète"],["style","Style"],["registration","Registration"],["tempo","Tempo","number"],["voix1","Voix 1"],["voix2","Voix 2"],["date","Date perform.","date"],["url","URL vidéo 1"],["url2","URL vidéo 2"],["hyperlink","Lien"]];
function edit(){
 const s=view.id?{...db.find(x=>x.id==view.id)}:{id:"n"+Date.now(),type:"Chanson",statut:"A voir",note:0,accords:""};const isNew=!view.id;
 hd(isNew?"Nouvelle chanson":"Modifier",()=>go(isNew?{n:"list"}:{n:"show",id:s.id,t:0}),`<button class="ib" id="ok">✓</button>`);
 const cl=[...new Set([...CLAV,...db.map(x=>x.clavier).filter(Boolean)])];
 $("#app").innerHTML=`<form onsubmit="return false">${FD.slice(0,2).map(f=>fld(f,s)).join("")}<div><label>Statut</label><select id="f_statut">${STAT.map(x=>`<option ${s.statut==x?"selected":""}>${x}</option>`).join("")}</select></div>
 ${FD.slice(2).map(f=>fld(f,s)).join("")}<div><label>Clavier</label><input type="text" id="f_clavier" list="cl" value="${esc(s.clavier)}"><datalist id="cl">${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
 <div><label>Note</label><div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=s.note?"on":""}">★</span>`).join("")}</div></div>
 <div><label>Fichier MIDI</label><div id="fm"></div><input type="file" id="im" accept=".mid,.midi,audio/midi,audio/x-midi"></div>
 <div><label>Audio</label><div id="fa"></div><input type="file" id="ia" accept="audio/*"> <button class="btn sec" id="rec" type="button">● Enregistrer</button></div>
 <div><label>Remarques</label><textarea id="f_remarques" rows="2">${esc(s.remarques)}</textarea></div>
 <div><label>Accords — écrire les accords entre crochets, juste avant la syllabe : [Am]Besame [Dm]mucho</label><textarea id="f_accords" rows="14" style="font-family:ui-monospace,monospace">${esc(s.accords)}</textarea></div>
 ${isNew?"":`${s.midi?'<button class="btn sec" type="button" id="xm">Retirer le MIDI</button>':""}${s.audio?'<button class="btn sec" type="button" id="xa">Retirer l’audio</button>':""}<button class="btn sec" id="del" style="color:var(--ac)">Supprimer cette chanson</button>`}</form>`;
 let note=s.note||0,pm,pa,rc;
 const lab=()=>{$("#fm").textContent=pm=="del"?"(sera supprimé)":pm?pm.name:s.midi||"";$("#fa").textContent=pa=="del"?"(sera supprimé)":pa?pa.name:s.audio||""};lab();
 $("#im").onchange=e=>{pm=e.target.files[0];lab()};$("#ia").onchange=e=>{pa=e.target.files[0];lab()};
 $("#rec").onclick=async()=>{try{if(rc){rc.stop();return}const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rc=new MediaRecorder(st);rc.ondataavailable=e=>ch.push(e.data);
  rc.onstop=()=>{st.getTracks().forEach(x=>x.stop());pa=new File(ch,"enregistrement-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".webm",{type:rc.mimeType});rc=null;$("#rec").textContent="● Enregistrer";lab()};rc.start();$("#rec").textContent="■ Arrêter"}catch(e){alert("Micro indisponible ici.")}};document.querySelectorAll("#st span").forEach(e=>e.onclick=()=>{note=note==+e.dataset.n?0:+e.dataset.n;document.querySelectorAll("#st span").forEach(x=>x.classList.toggle("on",+x.dataset.n<=note))});
 $("#ok").onclick=async()=>{const o={...s,note};[...FD.map(f=>f[0]),"statut","clavier","remarques","accords"].forEach(k=>o[k]=$("#f_"+k).value);
  if(!o.titre.trim())return alert("Le titre est obligatoire.");for(const [k,p] of [["midi",pm],["audio",pa]]){if(p=="del"){await fdel(o.id+":"+k);o[k]=""}else if(p){if(await fput(o.id+":"+k,{name:p.name,blob:p}))o[k]=p.name}}
  if(isNew)db.push(o);else db[db.findIndex(x=>x.id==s.id)]=o;touch(o.id);save();go({n:"show",id:o.id,t:0})};
 const xm=$("#xm"),xa=$("#xa");if(xm)xm.onclick=()=>{pm="del";lab()};if(xa)xa.onclick=()=>{pa="del";lab()};
 const d=$("#del");if(d)d.onclick=()=>{if(confirm("Supprimer « "+s.titre+" » ?")){fdel(s.id+":midi");fdel(s.id+":audio");db=db.filter(x=>x.id!=s.id);remove(s.id);save();go({n:"list"})}}}
function fld([k,l,t],s){return `<div><label>${l}</label><input type="${t||"text"}" id="f_${k}" value="${esc(s[k])}"></div>`}
async function dl(name,type,data){try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code=="declined")return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function menu(){const c=prompt("1 = Exporter tout (JSON, avec fichiers)\n2 = Importer (JSON)\n3 = Exporter (CSV)\n4 = Synchroniser maintenant\n5 = Se déconnecter");
 if(c=="1")(async()=>{const f={};for(const s of db)for(const k of["midi","audio"]){const v=s[k]&&await fget(s.id+":"+k);if(v)f[s.id+":"+k]={name:s[k],type:v.blob.type,data:await b64(v.blob)}}dl("psr_chansons.json","application/json",JSON.stringify({songs:db,files:f}))})();
 else if(c=="3"){const k=Object.keys(db[0]||{}),e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';dl("psr_chansons.csv","text/csv",[k.map(e).join(","),...db.map(s=>k.map(x=>e(s[x])).join(","))].join("\n"))}
 else if(c=="2"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{let a=JSON.parse(await i.files[0].text()),f={};if(!Array.isArray(a)){f=a.files||{};a=a.songs}if(!Array.isArray(a))throw 0;a.forEach(x=>{const j=db.findIndex(y=>y.id==x.id);if(j<0)db.push(x);else db[j]=x;touch(x.id)});save();for(const k in f){const bl=await (await fetch(f[k].data)).blob();await fput(k,{name:f[k].name,blob:bl})}render()}catch(e){alert("Fichier invalide.")}};i.click()}
 else if(c=="4")sync(true);else if(c=="5")logout()}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
